# elevate-pam — COSMIC greeter (NO pam.d)
# Auth: elevate-crypto via module unix. Session: quantra-logind.

[service]
name = "cosmic-greeter"
description = "COSMIC greeter — elevate-pam auth; session via quantra-logind"

[[auth]]
control = "required"
module = "env"
args = ["readenv=1"]

[[auth]]
control = "required"
module = "unix"

[[account]]
control = "required"
module = "unix"

[[password]]
control = "required"
module = "unix"

[[session]]
control = "required"
module = "env"

[[session]]
control = "required"
module = "limits"

[[session]]
control = "required"
module = "unix"
