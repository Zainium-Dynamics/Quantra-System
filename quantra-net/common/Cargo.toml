[package]
name        = "common"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
authors.workspace   = true
description = "Shared types, protocol framing, and error definitions for quantra-net"

[dependencies]
indexmap = "=2.6.0"
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror  = { workspace = true }
# Async framing used by quantra-netd; sync framing used by quantra-net CLI.
tokio      = { version = "1", features = ["io-util", "net"], optional = true }

[features]
default = []
async-io = ["tokio"]
