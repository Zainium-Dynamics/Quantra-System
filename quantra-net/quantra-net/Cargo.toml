[package]
name        = "quantra-net"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
authors.workspace   = true
description = "Zainium OS network CLI — sends commands to quantra-netd over a Unix socket"

[[bin]]
name = "quantra-net"
path = "src/main.rs"

[dependencies]
common     = { path = "../common" }
anyhow     = { workspace = true }
serde_json = { workspace = true }
# Derive-based arg parsing with zero boilerplate.
clap       = { version = "=4.5.23", features = ["derive", "color"] }

once_cell  = "1"
