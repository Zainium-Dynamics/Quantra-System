[package]
name        = "quantra-netd"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
authors.workspace   = true
description = "Zainium OS network daemon — kernel-level networking via rtnetlink"

[[bin]]
name = "quantra-netd"
path = "src/main.rs"

[lib]
name = "quantra_netd"
path = "src/lib.rs"

[build-dependencies]
chrono = "0.4"

[dependencies]
indexmap = "=2.6.0"
common     = { path = "../common", features = ["async-io"] }
tokio      = { version = "1", default-features = false, features = ["rt", "net", "macros", "time", "io-util", "signal", "sync", "process", "fs"] }
serde      = { workspace = true }
serde_json = { workspace = true }

anyhow     = { workspace = true }
futures    = { workspace = true }
tracing    = { workspace = true }
async-trait = { workspace = true }

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rtnetlink  = "0.13"
netlink-packet-route = "0.17"
libc       = "0.2"

once_cell  = "1"
serde_yaml = "0.9"
