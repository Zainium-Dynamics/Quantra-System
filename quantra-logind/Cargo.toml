[package]
name        = "quantra-logind"
version     = "6.0.1"
edition     = "2024"
rust-version = "1.97"
license     = "MIT"
description = "Zainium OS session/login manager — systemd-logind superset. Compatible with Flatpak, OSTree, COSMIC desktop, xdg-desktop-portal, PipeWire, polkit."

[[bin]]
name = "quantra-logind"
path = "src/main.rs"

[[bin]]
name = "quantra-logindctl"
path = "src/ctl.rs"

# C-ABI compat shim (sd-login.h / sd-daemon.h / sd-id128.h subset) —
# produces libqlogind.so.0 for programs (polkit, pipewire,
# xdg-desktop-portal, ...) that link a login/daemon-notify library
# directly instead of talking D-Bus. Own module tree under src/ffi/,
# doesn't touch the two bins above.
[lib]
name = "qlogind"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
indexmap = "=2.6.0"
anyhow     = "=1.0.86"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
libc       = "=0.2.155"
log        = { version = "=0.4.21", features = ["std"] }
nix        = { version = "=0.29.0", features = ["fs","process","signal","socket","user","resource","mount","ioctl"] }
serde      = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.117"
thiserror  = "=1.0.59"
toml       = "0.8"
oxibus-client = { git = "https://github.com/Zainium-Dynamics/oxibus.git", rev = "ddbab9d" }
oxibus-core = { git = "https://github.com/Zainium-Dynamics/oxibus.git", rev = "ddbab9d" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
