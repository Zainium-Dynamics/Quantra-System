[package]
name        = "quantra-logind"
version     = "6.0.1"
edition     = "2021"
rust-version = "1.82"
license     = "MIT"
description = "Zainium OS session/login manager — systemd-logind superset. Compatible with Flatpak, OSTree, COSMIC desktop, xdg-desktop-portal, PipeWire, polkit."

[[bin]]
name = "quantra-logind"
path = "src/main.rs"

[[bin]]
name = "quantra-logindctl"
path = "src/ctl.rs"

[dependencies]
indexmap = "=2.6.0"
anyhow     = "=1.0.86"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
libc       = "=0.2.155"
log        = { version = "=0.4.21", features = ["std"] }
nix        = { version = "=0.29.0", features = ["fs","process","signal","socket","user","resource","mount","ioctl"] }
serde      = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.117"
thiserror  = "=1.0.59"
toml       = "0.8"
